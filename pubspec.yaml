name: carely
description: "Application de prise de rendez-vous médicaux"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management (déjà en place)
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Navigation
  go_router: ^13.0.0

  # HTTP (déjà en place - pour le backend Node.js)
  http: ^1.2.1

  # Dates & calendrier
  intl: ^0.19.0
  table_calendar: ^3.1.1

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1    # Pour tes icônes SVG custom
  shimmer: ^3.0.0            # Loading skeletons
  flutter_rating_bar: ^4.0.1 # Étoiles notation médecins

  # Sécurité
  flutter_secure_storage: ^9.0.0  # Stockage JWT sécurisé (remplace shared_prefs pour tokens)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/images/
    - assets/icons/          # Tes icônes SVG/PNG custom ici

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21