name: carely
description: "Application de prise de rendez-vous médicaux"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Navigation
  go_router: ^13.0.0

  # HTTP & API
  http: ^1.2.1

  # Base de données locale (médecins)
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0

  # Dates & calendrier
  intl: ^0.19.0
  table_calendar: ^3.1.1

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1

  # Sécurité & stockage
  flutter_secure_storage: ^9.0.0

  # Caméra & galerie
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/images/
    - assets/icons/          # Tes icônes SVG/PNG custom ici

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21